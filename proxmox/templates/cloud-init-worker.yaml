#cloud-init configuration for Kubernetes worker nodes
# This script will be executed on the worker nodes to join the Kubernetes cluster

# Set the hostname
hostnamectl set-hostname worker-node

# Install necessary packages
apt-get update && apt-get install -y apt-transport-https ca-certificates curl

# Add Kubernetes APT repository
curl -s https://packages.cloud.google.com/apt/doc/apt-key.gpg | apt-key add -
cat <<EOF >/etc/apt/sources.list.d/kubernetes.list
deb https://apt.kubernetes.io/ kubernetes-xenial main
EOF

# Install kubelet, kubeadm, and kubectl
apt-get update
apt-get install -y kubelet kubeadm kubectl
apt-mark hold kubelet kubeadm kubectl

# Join the Kubernetes cluster
# The join command will be provided by the master node during initialization
echo "Please run the following command to join the cluster:"
echo "kubeadm join <master-ip>:<master-port> --token <token> --discovery-token-ca-cert-hash sha256:<hash>"